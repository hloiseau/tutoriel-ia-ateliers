name: Recuperer les exports ZdS
on:
  push:
    branches: ["integration/archives-zds"]
    paths: [".github/workflows/import-zds.yml", "outils/decompresser_imports.py"]
permissions:
  contents: write
jobs:
  extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Decompresser les archives
        run: python3 outils/decompresser_imports.py
      - name: Enregistrer les fichiers recuperes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imports/deplie
          git commit -m "Decompresser les trois exports ZdS fournis"
          git push origin HEAD:integration/archives-zds
